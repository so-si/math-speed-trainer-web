name: Add Kai once
on:
  push:
    paths:
      - .github/workflows/add-kai-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  '0321': { studentId: '3', name: 'そうし' }\n"
          new = "  '0321': { studentId: '3', name: 'そうし' },\n  '1102': { studentId: '4', name: 'かい' }\n"
          if "'1102': { studentId: '4', name: 'かい' }" not in s:
              if old not in s:
                  raise SystemExit('target not found')
              s = s.replace(old, new, 1)
          s = s.replace("const APP_VERSION = '2026-09-15-ultralight-13';", "const APP_VERSION = '2026-09-17-ultralight-14';")
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          rm .github/workflows/add-kai-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-kai-once.yml
          git commit -m "Add Kai user" || exit 0
          git push
