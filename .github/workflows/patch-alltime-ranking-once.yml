name: Patch all-time ranking UI once
on:
  push:
    paths:
      - '.github/workflows/patch-alltime-ranking-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_rules = '・各ジャンルの「今日のベスト」と「全ユーザー横断の暦日ベストTOP10」を記録します。'
          new_rules = '・「みんなの記録」は、各ユーザーの全期間ベスト1件だけを使ってTOP5を表示します。'
          if old_rules in s:
              s = s.replace(old_rules, new_rules)

          old_render = """    const allRows = (g.ranking || []).map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + formatTime(r.bestMs) + '</td><td>' +
      escapeHtml(r.name || '') + '</td><td>' + escapeHtml(formatDateClient(r.date)) + '</td></tr>'
    ).join('');"""
          new_render = """    const uniqueRanking = [];
    const seenStudents = new Set();
    (g.ranking || []).forEach(r => {
      const sid = String(r.studentId || r.name || '');
      if (!sid || seenStudents.has(sid)) return;
      seenStudents.add(sid);
      uniqueRanking.push(r);
    });
    const allRows = uniqueRanking.slice(0, 5).map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + formatTime(r.bestMs) + '</td><td>' +
      escapeHtml(r.name || '') + '</td><td>' + escapeHtml(formatDateClient(r.date)) + '</td></tr>'
    ).join('');"""
          if old_render not in s:
              raise SystemExit('render target not found')
          s = s.replace(old_render, new_render)

          old_status = """  const everyone = (genre.ranking || [])
    .map(r => Number(r.bestMs || 0))
    .filter(ms => ms > 0);

  const personalQualifies =
    personal.length < 5 || elapsedMs < Math.max(...personal);

  const everyoneQualifies =
    everyone.length < 5 || elapsedMs < Math.max(...everyone);"""
          new_status = """  const everyoneRows = (genre.ranking || []).filter(r => Number(r.bestMs || 0) > 0);
  const myGlobalBest = everyoneRows.find(r => String(r.studentId || '') === String(state.studentId || ''));
  const everyone = everyoneRows.map(r => Number(r.bestMs || 0));

  const personalQualifies =
    personal.length < 5 || elapsedMs < Math.max(...personal);

  const wouldImproveMyGlobalBest = !myGlobalBest || elapsedMs < Number(myGlobalBest.bestMs || 0);
  const everyoneQualifies = wouldImproveMyGlobalBest &&
    (everyone.length < 5 || elapsedMs < Math.max(...everyone));"""
          if old_status not in s:
              raise SystemExit('status target not found')
          s = s.replace(old_status, new_status)

          import re
          s = re.sub(r"const APP_VERSION = '[^']*';", "const APP_VERSION = '2026-09-23-ultralight-22';", s)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/patch-alltime-ranking-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-alltime-ranking-once.yml
          git commit -m "Show one all-time best per user in global ranking"
          git push
