<!DOCTYPE html>
<html lang="ja">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>計算トレーニング</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; touch-action: manipulation; }
    .app { max-width: 760px; margin: 0 auto; padding: 18px; }
    .panel {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .hidden { display: none !important; }
    h1 { margin: 0 0 18px; text-align: center; font-size: 30px; }
    h2 { margin: 0 0 14px; font-size: 22px; }
    h3 { margin: 18px 0 8px; font-size: 17px; }
    .field { margin: 16px 0; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    select, input[type="password"] {
      width: 100%;
      border: 1px solid #444;
      background: #1c1c1c;
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
    }
    input[type="password"] {
      text-align: center;
      letter-spacing: .35em;
      font-variant-numeric: tabular-nums;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #fff;
      color: #000;
      font-weight: 800;
      font-size: 20px;
      cursor: pointer;
    }
    .primary:disabled { opacity: .45; }
    .secondary {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 9px 12px;
      background: #1a1a1a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .message { min-height: 22px; margin-top: 10px; text-align: center; color: #ff6b6b; }
    .welcome { text-align: center; font-weight: 800; margin-bottom: 12px; }
    .rules {
      background: #181818;
      border: 1px solid #343434;
      border-radius: 14px;
      padding: 14px 16px;
      line-height: 1.7;
      margin: 14px 0 18px;
    }
    .rules strong { color: #ffd166; }
    .fail-status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #181818;
      margin-bottom: 14px;
      font-weight: 800;
    }
    .fail-status.danger { color: #ff6b6b; }
    .genre-card {
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      background: #151515;
    }
    .genre-card.locked { opacity: .48; }
    .genre-card.tappable {
      cursor: pointer;
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-card.tappable:active {
      transform: scale(.99);
      background: #1b1b1b;
      border-color: #555;
    }
    .genre-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .genre-name { font-weight: 800; }
    .badge {
      font-size: 12px;
      border-radius: 999px;
      padding: 5px 9px;
      background: #2a2a2a;
    }
    .badge.clear { color: #8be28b; }
    .badge.lock { color: #aaa; }
    .best {
      margin-top: 8px;
      font-size: 14px;
      color: #ddd;
    }
    .ranking-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .ranking {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
      table-layout: fixed;
    }
    .ranking th, .ranking td {
      padding: 8px 8px;
      border-bottom: 1px solid #2b2b2b;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ranking th:nth-child(1), .ranking td:nth-child(1) { width: 52px; }
    .ranking th:nth-child(2), .ranking td:nth-child(2) { width: 110px; }
    .ranking th:nth-child(3), .ranking td:nth-child(3) { width: 150px; }
    .ranking th:nth-child(4), .ranking td:nth-child(4) { width: 110px; }
    .ranking th:last-child, .ranking td:last-child { text-align: right; }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .timer { font-weight: 800; font-variant-numeric: tabular-nums; }
    .progress {
      height: 12px;
      background: #262626;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress > div {
      height: 100%;
      width: 100%;
      background: #fff;
    }
    .question {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: 900;
      text-align: center;
    }
    .answer {
      min-height: 78px;
      border: 2px solid #555;
      border-radius: 14px;
      padding: 10px 16px;
      background: #101010;
      font-size: 44px;
      font-weight: 800;
      text-align: right;
      margin-bottom: 16px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key {
      min-height: 70px;
      border: 1px solid #383838;
      border-radius: 14px;
      background: #202020;
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .key:active {
      transform: scale(.97);
      background: #2b2b2b;
    }
    .key.submit { background: #fff; color: #000; font-size: 20px; }
    .feedback {
      text-align: center;
      min-height: 38px;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .feedback.ok { color: #7bd88f; }
    .feedback.ng { color: #ff6b6b; }
    .result-grid { display: grid; gap: 10px; margin: 18px 0; }
    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: #171717;
      border-radius: 10px;
    }
    @media (max-width: 600px) {
      .app { padding: 10px; }
      .panel { padding: 16px; }
      .question { font-size: 48px; }
      .answer { font-size: 38px; }
      .key { min-height: 64px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div id="loading" class="panel">読み込み中...</div>

  <div id="home" class="panel hidden">
    <h1>計算トレーニング</h1>

    <div id="loginArea">
      <div class="field">
        <label for="pin">4桁PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
        <div id="loginMessage" class="message"></div>
        <div id="diagnostic" style="margin-top:8px;text-align:center;font-size:12px;color:#888;"></div>
      </div>
      <button id="loginBtn" class="primary" onclick="login()">ログイン</button>
    </div>

    <div id="dashboardArea" class="hidden">
      <div id="welcome" class="welcome"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="secondary" onclick="logoutUser()">ログアウト</button>
      </div>

      <div class="rules">
        <strong>ルール</strong><br>
        ・1セットは20問です。<br>
        ・<strong>1問でも間違えたら、その時点で失格</strong>です。<br>
        ・20問すべて正解し、<strong>120秒以内</strong>に終えると次のジャンルが解放されます。<br>
        ・失格が<strong>1日5回</strong>に達すると、その日は挑戦できません。<br>
        ・ギブアップと120秒超過も失格1回として数えます。<br>
        ・各ジャンルの「今日のベスト」と「全ユーザー横断の暦日ベストTOP10」を記録します。
      </div>

      <div id="failStatus" class="fail-status"></div>

      <div id="genreStats"></div>
    </div>
  </div>

  <div id="game" class="panel hidden">
    <div class="top-row">
      <div id="counter"></div>
      <button class="secondary" onclick="giveUp()">ギブアップ</button>
      <div id="timer" class="timer">120.0秒</div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="question" class="question"></div>
    <div id="feedback" class="feedback"></div>
    <div id="answer" class="answer">&nbsp;</div>
    <div class="keypad" id="keypad">
      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key" data-action="backspace">⌫</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key submit" data-action="submit">決定</button>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <h2 id="resultTitle">結果</h2>
    <div id="resultBody" class="result-grid"></div>
    <button class="primary" onclick="backHome()">トップへ</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxaH7UesXEkw9HMcuoiv5j1knakn96OtILmGlFLy0t_-VF1mspdz_znwazkubzfLyOT/exec';
const APP_VERSION = '2026-09-15-ultralight-1';

const GENRES = [
  { id: 'one_digit_add_sub', name: '一桁の足し算・引き算' },
  { id: 'two_digit_plus_minus_one', name: '二桁 ± 一桁' },
  { id: 'multiplication', name: '九九' },
  { id: 'division_facts', name: '九九（割り算）' },
  { id: 'two_digit_add_sub', name: '二桁の足し算・引き算' },
  { id: 'division_remainder', name: '余りありの割り算' },
  { id: 'two_digit_times_one', name: '二桁 × 一桁' }
];

const state = {
  studentId: null,
  sessionToken: null,
  name: '',
  dashboard: null,
  genre: null,
  questions: [],
  index: 0,
  input: '',
  quotientInput: '',
  remainderInput: '',
  answerStage: 'single',
  startedAt: 0,
  accepting: false,
  timerId: null,
  finished: false
};

document.addEventListener('DOMContentLoaded', () => {
  show('home');
  const d = document.getElementById('diagnostic');
  if (d) {
    d.textContent = 'version ' + APP_VERSION + ' / ' + (navigator.onLine ? 'online' : 'offline');
  }
});

function apiRequest(action, payload = {}) {
  return new Promise((resolve, reject) => {
    const cb = 'ms_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer;

    window[cb] = data => {
      clearTimeout(timer);
      delete window[cb];
      script.remove();

      if (data && data.success === false) {
        reject(new Error(data.error || data.message || 'APIエラー'));
      } else {
        resolve(data || {});
      }
    };

    timer = setTimeout(() => {
      delete window[cb];
      script.remove();
      reject(new Error('通信がタイムアウトしました。'));
    }, 20000);

    const params = new URLSearchParams({
      action,
      callback: cb,
      payload: JSON.stringify(payload)
    });

    script.src = API_URL + '?' + params.toString();

    script.onerror = () => {
      clearTimeout(timer);
      delete window[cb];
      script.remove();
      reject(new Error('GASへの接続に失敗しました。'));
    };

    document.head.appendChild(script);
  });
}

async function login() {
  const pin = document.getElementById('pin').value.trim();
  const message = document.getElementById('loginMessage');
  message.textContent = '';

  if (!/^\d{4}$/.test(pin)) {
    message.textContent = '4桁のPINを入力してください。';
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '確認中...';

  try {
    const response = await apiRequest('authenticateByPin', { pin });
    state.studentId = response.studentId;
    state.sessionToken = response.token;
    state.name = response.name || '';
    document.getElementById('pin').value = '';

    document.getElementById('loginArea').classList.add('hidden');
    document.getElementById('dashboardArea').classList.remove('hidden');

    if (response.dashboard) {
      applyDashboard(response.dashboard);
    } else {
      refreshDashboard().catch(e => {
        console.warn(e);
        if (isAuthError(e)) {
          resetToLogin('セッションが切れました。もう一度PINを入力してください。');
        } else {
          document.getElementById('failStatus').textContent =
            '成績の読み込みに失敗しました。';
        }
      });
    }
  } catch (e) {
    message.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
}

function logoutUser() {
  resetToLogin();
}

function resetToLogin(message = '') {
  clearInterval(state.timerId);
  state.studentId = null;
  state.sessionToken = null;
  state.name = '';
  state.dashboard = null;
  state.genre = null;
  state.questions = [];
  state.index = 0;
  state.input = '';
  state.finished = false;
  state.accepting = false;

  document.getElementById('dashboardArea').classList.add('hidden');
  document.getElementById('loginArea').classList.remove('hidden');
  document.getElementById('loginMessage').textContent = message;
  document.getElementById('pin').value = '';
  show('home');
}

function isAuthError(error) {
  const msg = String(error && error.message ? error.message : error || '');
  return msg.includes('認証の有効期限') || msg.includes('認証情報');
}

function applyDashboard(d) {
  state.dashboard = d;
  document.getElementById('welcome').textContent = state.name ? state.name + ' さん' : '';
  const failStatus = document.getElementById('failStatus');
  failStatus.textContent = '今日の失格：' + d.todayFails + ' / ' + d.failLimit;
  failStatus.classList.toggle('danger', d.todayFails >= d.failLimit);
  renderGenreStats(d.genres, d.lockedForToday);
}

async function refreshDashboard() {
  const d = await apiRequest('getDashboard', authPayload());
  applyDashboard(d);
}

function renderGenreStats(genres, lockedForToday = false) {
  const box = document.getElementById('genreStats');

  box.innerHTML = genres.map(g => {
    const todayBest = g.todayBestMs == null ? '—' : formatTime(g.todayBestMs);

    const allRows = (g.ranking || []).map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(r.name || '') + '</td><td>' +
      escapeHtml(formatDateClient(r.date)) + '</td><td>' + formatTime(r.bestMs) + '</td></tr>'
    ).join('');

    const personalRows = (g.personalRanking || []).map((r, i) =>
      '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(state.name || '') + '</td><td>' +
      escapeHtml(formatDateClient(r.date)) + '</td><td>' + formatTime(r.bestMs) + '</td></tr>'
    ).join('');

    const canStart = g.unlocked && !lockedForToday;
    return '<div class="genre-card ' + (canStart ? 'tappable' : 'locked') + '"' +
      (canStart ? ' role="button" tabindex="0" onclick="startChallenge(\'' + escapeHtml(g.id) + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){startChallenge(\'' + escapeHtml(g.id) + '\')}"' : '') +
      '>' +
      '<div class="genre-head">' +
        '<div class="genre-name">' + escapeHtml(g.name) + '</div>' +
        '<div class="badge ' + (g.cleared ? 'clear' : (g.unlocked ? '' : 'lock')) + '">' +
          (g.cleared ? 'クリア済み' : (g.unlocked ? '挑戦可' : '未解放')) +
        '</div>' +
      '</div>' +
      '<div class="best">今日のベスト：<strong>' + todayBest + '</strong></div>' +

      '<h3>自分のベストタイムランキング（暦日）</h3>' +
      (personalRows
        ? '<div class="ranking-wrap"><table class="ranking"><thead><tr><th>順位</th><th>ユーザー</th><th>日付</th><th>ベスト</th></tr></thead><tbody>' + personalRows + '</tbody></table></div>'
        : '<div class="best">まだ記録がありません。</div>') +

      '<h3>全ユーザーベストタイムランキング（暦日）</h3>' +
      (allRows
        ? '<div class="ranking-wrap"><table class="ranking"><thead><tr><th>順位</th><th>ユーザー</th><th>日付</th><th>ベスト</th></tr></thead><tbody>' + allRows + '</tbody></table></div>'
        : '<div class="best">まだ記録がありません。</div>') +
    '</div>';
  }).join('');
}

function startChallenge(genre) {
  if (!genre || !state.dashboard) return;

  const g = (state.dashboard.genres || []).find(x => x.id === genre);
  if (!g || !g.unlocked || state.dashboard.lockedForToday) return;

  state.genre = genre;
  state.questions = generateSet(
    genre,
    state.dashboard.questionCount || 20
  );
  state.index = 0;
  state.input = '';
  state.startedAt = performance.now();
  state.accepting = true;
  state.finished = false;

  show('game');
  showQuestion();
  startMasterTimer(state.dashboard.clearTimeMs || 120000);
}

function generateSet(genre, count) {
  const out = [];
  const seen = new Set();
  let guard = 0;

  while (out.length < count && guard < 5000) {
    guard++;
    const q = generateQuestion(genre);
    const key = q.text;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(q);
  }

  while (out.length < count) out.push(generateQuestion(genre));
  return out;
}

function generateQuestion(genre) {
  let a, b, op, answer;

  if (genre === 'one_digit_add_sub') {
    op = Math.random() < 0.5 ? '+' : '-';
    if (op === '+') {
      a = rnd(1, 9); b = rnd(1, 9); answer = a + b;
    } else {
      a = rnd(2, 9); b = rnd(1, a - 1); answer = a - b;
    }
  } else if (genre === 'two_digit_plus_minus_one') {
    op = Math.random() < 0.5 ? '+' : '-';

    if (op === '+') {
      // 必ず一の位で繰り上がる
      a = rnd(10, 99);
      const ones = a % 10;
      const minB = Math.max(1, 10 - ones);
      b = rnd(minB, 9);
      answer = a + b;
    } else {
      // 必ず一の位で繰り下がる
      a = rnd(10, 99);
      const ones = a % 10;
      const minB = Math.max(1, ones + 1);
      b = rnd(minB, 9);
      answer = a - b;

      // 答えが0以下にならないよう安全策
      if (answer <= 0) {
        a = rnd(20, 99);
        const safeOnes = a % 10;
        b = rnd(Math.max(1, safeOnes + 1), 9);
        answer = a - b;
      }
    }
  } else if (genre === 'two_digit_add_sub') {
    op = Math.random() < 0.5 ? '+' : '-';
    if (op === '+') {
      a = rnd(10, 99); b = rnd(10, 99); answer = a + b;
    } else {
      a = rnd(11, 99); b = rnd(10, a - 1); answer = a - b;
    }
  } else if (genre === 'multiplication') {
    a = rnd(1, 9); b = rnd(1, 9); op = '×'; answer = a * b;
  } else if (genre === 'division_facts') {
    const x = rnd(1, 9);
    const y = rnd(1, 9);
    a = x * y; b = x; op = '÷'; answer = y;
  } else if (genre === 'division_remainder') {
    b = rnd(2, 9);
    const quotient = rnd(1, 9);
    const remainder = rnd(1, b - 1);
    a = b * quotient + remainder;
    op = '÷';
    answer = { quotient, remainder };
  } else if (genre === 'two_digit_times_one') {
    a = rnd(10, 99); b = rnd(1, 9); op = '×'; answer = a * b;
  } else {
    throw new Error('未対応ジャンル');
  }

  return { text: a + ' ' + op + ' ' + b, answer };
}

function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function showQuestion() {
  const q = state.questions[state.index];
  state.input = '';
  state.quotientInput = '';
  state.remainderInput = '';
  state.answerStage = state.genre === 'division_remainder' ? 'quotient' : 'single';
  state.accepting = true;
  document.getElementById('counter').textContent = (state.index + 1) + ' / 20';
  document.getElementById('question').textContent = q.text;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  updateAnswer();
}

function bindKeypad() {
  const keypad = document.getElementById('keypad');
  if (!keypad || keypad.dataset.bound === '1') return;
  keypad.dataset.bound = '1';

  keypad.addEventListener('pointerdown', e => {
    const btn = e.target.closest('button.key');
    if (!btn) return;
    e.preventDefault();

    if (btn.dataset.digit != null) {
      digit(btn.dataset.digit);
    } else if (btn.dataset.action === 'backspace') {
      backspace();
    } else if (btn.dataset.action === 'submit') {
      submitAnswer();
    }
  }, { passive: false });
}
bindKeypad();

function digit(d) {
  if (!state.accepting) return;

  if (state.genre === 'division_remainder') {
    const key = state.answerStage === 'quotient' ? 'quotientInput' : 'remainderInput';
    if (state[key].length >= 3) return;
    state[key] = state[key] === '0' ? d : state[key] + d;
  } else {
    if (state.input.length >= 6) return;
    state.input = state.input === '0' ? d : state.input + d;
  }

  updateAnswer();
}

function backspace() {
  if (!state.accepting) return;

  if (state.genre === 'division_remainder') {
    const key = state.answerStage === 'quotient' ? 'quotientInput' : 'remainderInput';
    state[key] = state[key].slice(0, -1);
  } else {
    state.input = state.input.slice(0, -1);
  }

  updateAnswer();
}

function updateAnswer() {
  const el = document.getElementById('answer');

  if (state.genre === 'division_remainder') {
    const q = state.quotientInput || '＿';
    const r = state.remainderInput || '＿';
    el.textContent = '商 ' + q + '　あまり ' + r;
    return;
  }

  el.textContent = state.input || '\u00a0';
}

function submitAnswer() {
  if (!state.accepting || state.finished) return;

  const q = state.questions[state.index];

  if (state.genre === 'division_remainder') {
    if (state.answerStage === 'quotient') {
      if (state.quotientInput === '') return;
      state.answerStage = 'remainder';
      updateAnswer();
      return;
    }

    if (state.remainderInput === '') return;

    const quotient = Number(state.quotientInput);
    const remainder = Number(state.remainderInput);
    state.accepting = false;

    if (
      quotient !== q.answer.quotient ||
      remainder !== q.answer.remainder
    ) {
      document.getElementById('feedback').textContent = '失格';
      document.getElementById('feedback').className = 'feedback ng';
      finish(false, 'wrong_answer', q, quotient + ' あまり ' + remainder);
      return;
    }
  } else {
    if (state.input === '') return;

    const value = Number(state.input);
    state.accepting = false;

    if (value !== q.answer) {
      document.getElementById('feedback').textContent = '失格';
      document.getElementById('feedback').className = 'feedback ng';
      finish(false, 'wrong_answer', q, value);
      return;
    }
  }

  state.index++;

  if (state.index >= 20) {
    finish(true, '', q, state.genre === 'division_remainder'
      ? state.quotientInput + ' あまり ' + state.remainderInput
      : Number(state.input));
    return;
  }

  document.getElementById('feedback').textContent = '○';
  document.getElementById('feedback').className = 'feedback ok';
  setTimeout(showQuestion, 180);
}

function startMasterTimer(limitMs) {
  clearInterval(state.timerId);
  state.timerId = setInterval(() => {
    if (state.finished) return;
    const elapsed = performance.now() - state.startedAt;
    const remaining = Math.max(0, limitMs - elapsed);
    document.getElementById('timer').textContent = (remaining / 1000).toFixed(1) + '秒';
    document.getElementById('progressBar').style.width = ((remaining / limitMs) * 100) + '%';

    if (remaining <= 0) {
      const q = state.questions[state.index] || null;
      finish(false, 'time_over', q, state.input === '' ? null : Number(state.input));
    }
  }, 50);
}

function giveUp() {
  if (state.finished) return;
  if (!confirm('ギブアップしますか？\n失格1回として記録されます。')) return;
  const q = state.questions[state.index] || null;
  finish(false, 'give_up', q, state.input === '' ? null : Number(state.input));
}

async function finish(success, failReason, failedQuestion, userAnswer) {
  if (state.finished) return;
  state.finished = true;
  state.accepting = false;
  clearInterval(state.timerId);

  const elapsedMs = Math.round(performance.now() - state.startedAt);
  const effectiveSuccess = success && elapsedMs <= 120000;
  const reason = effectiveSuccess ? '' : (failReason || 'time_over');

  try {
    const response = await apiRequest('saveAttempt', {
      ...authPayload(),
      genre: state.genre,
      success: effectiveSuccess,
      elapsedMs,
      failReason: reason,
      answeredCount: effectiveSuccess ? 20 : state.index,
      failedQuestion: failedQuestion ? failedQuestion.text : '',
      userAnswer: userAnswer,
      correctAnswer: failedQuestion
        ? (state.genre === 'division_remainder'
            ? failedQuestion.answer.quotient + ' あまり ' + failedQuestion.answer.remainder
            : failedQuestion.answer)
        : null
    });

    state.dashboard = response.dashboard || null;
  } catch (e) {
    if (isAuthError(e)) {
      resetToLogin('セッションが切れました。もう一度PINを入力してください。');
      return;
    }
    alert('結果保存に失敗しました。\n' + e.message);
  }

  const title = effectiveSuccess ? 'クリア！' : '失格';
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultBody').innerHTML =
    '<div class="result-row"><span>タイム</span><strong>' + formatTime(elapsedMs) + '</strong></div>' +
    '<div class="result-row"><span>回答</span><strong>' + (effectiveSuccess ? 20 : state.index) + ' / 20</strong></div>' +
    (effectiveSuccess
      ? '<div class="result-row"><span>判定</span><strong>次ジャンル解放条件クリア</strong></div>'
      : '<div class="result-row"><span>判定</span><strong>' + failReasonLabel(reason) + '</strong></div>');

  show('result');
}

function failReasonLabel(reason) {
  if (reason === 'wrong_answer') return '誤答';
  if (reason === 'time_over') return '120秒超過';
  if (reason === 'give_up') return 'ギブアップ';
  return '失格';
}

async function backHome() {
  show('home');
  document.getElementById('loginArea').classList.add('hidden');
  document.getElementById('dashboardArea').classList.remove('hidden');
  try {
    await refreshDashboard();
  } catch (e) {
    console.warn(e);
    if (isAuthError(e)) {
      resetToLogin('セッションが切れました。もう一度PINを入力してください。');
    }
  }
}

function authPayload() {
  return {
    studentId: state.studentId,
    sessionToken: state.sessionToken
  };
}

function formatDateClient(dateKey) {
  const s = String(dateKey || '').trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s;

  const y = Number(m[1]);
  const mo = Number(m[2]);
  const d = Number(m[3]);
  const dt = new Date(y, mo - 1, d);
  const w = ['日','月','火','水','木','金','土'][dt.getDay()];

  return mo + '月' + d + '日（' + w + '）';
}

function formatTime(ms) {
  if (ms == null) return '—';
  return (Number(ms) / 1000).toFixed(2) + '秒';
}

function setDisabledIfExists(id, disabled) {
  const el = document.getElementById(id);
  if (el) el.disabled = !!disabled;
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function show(id) {
  ['loading', 'home', 'game', 'result'].forEach(x => document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
</script>
